<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выбор задач</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .query-form {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 420px;
    }

    .query-form input,
    .query-form select {
      width: 300px;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .query-form label {
      display: inline-block;
      margin-right: 20px;
      font-size: 16px;
    }

    .query-form button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .query-form button:hover {
      background-color: #0056b3;
    }

    .query-form button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .query-form .radio-group {
      margin-bottom: 20px;
    }

    #dates-input {
      display: none;
      gap: 10px;
      justify-content: center;
    }

    #dates-input input {
      width: 140px;
    }

    .status-box,
    .error-box {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: left;
      font-size: 14px;
      line-height: 1.4;
    }

    .status-box {
      border: 1px solid #b6d4fe;
      background: #e7f1ff;
      color: #084298;
      display: none;
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
    }

    .error-box {
      border: 1px solid #f5c2c7;
      color: #842029;
      background: #f8d7da;
    }
  </style>
</head>
<body>
  <div class="query-form">
    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    <div class="status-box" id="status-box"></div>

    <form id="fetch-form" action="/fetch-tasks" method="POST" onsubmit="return startFetch(event)">
      <select name="area" id="area-select">
        {% for area in areas %}
          <option value="{{ area }}" {% if area == selected_area %}selected{% endif %}>{{ area }}</option>
        {% endfor %}
      </select>
      <h2>Выберите способ получения задач</h2>

      <div class="radio-group">
        <label>
          <input type="radio" name="mode" value="label" checked onchange="toggleMode()"> По метке
        </label>
        <label>
          <input type="radio" name="mode" value="dates" onchange="toggleMode()"> По диапазону дат
        </label>
      </div>

      <div id="label-input">
        <input list="week-options" name="query_label" id="week-select" type="text" placeholder="23.06-27.06.2025" />
        <datalist id="week-options"></datalist>
      </div>

      <div id="dates-input">
        <input type="date" name="start_date" />
        <input type="date" name="end_date" />
      </div>

      <br />
      <button id="submit-btn" type="submit">Получить задачи</button>
    </form>
  </div>

  <script>
    let statusPollInterval = null;

    function formatDate(date) {
      return date.toLocaleDateString('ru-RU', {
        day: '2-digit',
        month: '2-digit'
      });
    }

    function getCurrentMonday(date) {
      const day = date.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const monday = new Date(date);
      monday.setDate(date.getDate() + diff);
      return monday;
    }

    function generateWeeks(count = 10) {
      const datalist = document.getElementById('week-options');
      const input = document.getElementById('week-select');
      const currentMonday = getCurrentMonday(new Date());

      for (let i = -count; i <= count; i++) {
        const monday = new Date(currentMonday);
        monday.setDate(monday.getDate() + i * 7);

        const friday = new Date(monday);
        friday.setDate(friday.getDate() + 4);

        const label = `${formatDate(monday)}-${formatDate(friday)}.${friday.getFullYear()}`;
        const option = document.createElement('option');
        option.value = label;
        datalist.appendChild(option);

        if (i === 0) {
          input.value = label;
        }
      }
    }

    function toggleMode() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      document.getElementById('label-input').style.display = mode === 'label' ? 'block' : 'none';
      document.getElementById('dates-input').style.display = mode === 'dates' ? 'flex' : 'none';
    }

    function validateForm() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      if (mode === 'dates') {
        const start = document.querySelector('[name="start_date"]').value;
        const end = document.querySelector('[name="end_date"]').value;
        if (!start || !end) {
          alert('Пожалуйста, выберите начальную и конечную дату.');
          return false;
        }
      } else {
        const label = document.getElementById('week-select').value.trim();
        if (!label) {
          alert('Пожалуйста, выберите или введите метку.');
          return false;
        }
      }
      return true;
    }

    function setStatus(message, isError = false) {
      const box = document.getElementById('status-box');
      box.style.display = 'block';
      box.style.borderColor = isError ? '#f5c2c7' : '#b6d4fe';
      box.style.background = isError ? '#f8d7da' : '#e7f1ff';
      box.style.color = isError ? '#842029' : '#084298';
      box.textContent = message;
      box.scrollTop = box.scrollHeight;
    }

    async function pollStatus(jobId) {
      try {
        const response = await fetch(`/fetch-status/${jobId}`);
        const data = await response.json();

        if (!data.ok) {
          clearInterval(statusPollInterval);
          setStatus(data.error || 'Не удалось получить статус загрузки', true);
          document.getElementById('submit-btn').disabled = false;
          return;
        }

        const logs = (data.logs || []).join('\n');
        setStatus(logs || data.message || 'Идет загрузка...');

        if (data.status === 'done') {
          clearInterval(statusPollInterval);
          setStatus((logs ? logs + '\n' : '') + 'Готово! Переход на канбан...');
          window.location.href = '/kanban';
        }

        if (data.status === 'error') {
          clearInterval(statusPollInterval);
          const err = data.error || 'Ошибка загрузки задач';
          setStatus((logs ? logs + '\n' : '') + err + '\nМожно повторить запрос.', true);
          document.getElementById('submit-btn').disabled = false;
        }
      } catch (error) {
        clearInterval(statusPollInterval);
        setStatus(`Ошибка при проверке статуса: ${error}`, true);
        document.getElementById('submit-btn').disabled = false;
      }
    }

    async function startFetch(event) {
      event.preventDefault();

      if (!validateForm()) {
        return false;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      setStatus('Запускаем загрузку задач...');

      const form = document.getElementById('fetch-form');
      const formData = new FormData(form);

      try {
        const response = await fetch('/start-fetch', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (!response.ok || !data.ok) {
          submitBtn.disabled = false;
          setStatus(data.error || 'Не удалось запустить загрузку', true);
          return false;
        }

        if (statusPollInterval) {
          clearInterval(statusPollInterval);
        }
        await pollStatus(data.job_id);
        statusPollInterval = setInterval(() => pollStatus(data.job_id), 1200);
      } catch (error) {
        submitBtn.disabled = false;
        setStatus(`Ошибка запуска загрузки: ${error}`, true);
      }

      return false;
    }

    generateWeeks();
  </script>
</body>
</html>
