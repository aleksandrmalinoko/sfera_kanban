<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выбор задач</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .query-form {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 420px;
    }

    .query-form input[type="text"],
    .query-form input[type="date"],
    .query-form select {
      width: 300px;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .query-form label {
      font-size: 16px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      cursor: pointer;
    }

    .radio-group input[type="radio"] {
      margin: 0;
      width: auto;
      accent-color: #007bff;
    }

    .query-form button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .query-form button:hover {
      background-color: #0056b3;
    }

    .query-form button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .query-form .radio-group {
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    #dates-input {
      display: none;
      gap: 10px;
      justify-content: center;
    }

    #dates-input input {
      width: 140px;
    }

    .error-box {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: left;
      font-size: 14px;
      line-height: 1.4;
      border: 1px solid #f5c2c7;
      color: #842029;
      background: #f8d7da;
    }

    /* Прогресс-секция — скрыта пока не запущена загрузка */
    .progress-section {
      display: none;
      margin-bottom: 15px;
      text-align: left;
    }

    .progress-bar-track {
      height: 8px;
      background: #dde3ec;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #007bff;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .progress-bar-fill.indeterminate {
      width: 40%;
      animation: indeterminate 1.2s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0%   { margin-left: -40%; }
      100% { margin-left: 100%; }
    }

    .progress-status {
      font-size: 13px;
      color: #084298;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .progress-log {
      font-size: 12px;
      color: #444;
      background: #f3f5f9;
      border: 1px solid #d0d7e3;
      border-radius: 4px;
      padding: 6px 8px;
      height: 80px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="query-form">
    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    <div class="progress-section" id="progress-section">
      <div class="progress-bar-track">
        <div class="progress-bar-fill indeterminate" id="progress-bar"></div>
      </div>
      <div class="progress-status" id="progress-status">Подготовка…</div>
      <div class="progress-log" id="progress-log"></div>
    </div>

    <form id="fetch-form" action="/fetch-tasks" method="POST" onsubmit="return startFetch(event)">
      <select name="area" id="area-select">
        {% for area in areas %}
          <option value="{{ area }}" {% if area == selected_area %}selected{% endif %}>{{ area }}</option>
        {% endfor %}
      </select>
      <h2>Выберите способ получения задач</h2>

      <div class="radio-group">
        <label>
          <input type="radio" name="mode" value="label" checked onchange="toggleMode()"> По метке
        </label>
        <label>
          <input type="radio" name="mode" value="dates" onchange="toggleMode()"> По диапазону дат
        </label>
      </div>

      <div id="label-input">
        <input list="week-options" name="query_label" id="week-select" type="text" placeholder="23.06-27.06.2025" />
        <datalist id="week-options"></datalist>
      </div>

      <div id="dates-input">
        <input type="date" name="start_date" />
        <input type="date" name="end_date" />
      </div>

      <br />
      <button id="submit-btn" type="submit">Получить задачи</button>
    </form>
  </div>

  <script>
    let statusPollInterval = null;

    function formatDate(date) {
      return date.toLocaleDateString('ru-RU', {
        day: '2-digit',
        month: '2-digit'
      });
    }

    function getCurrentMonday(date) {
      const day = date.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const monday = new Date(date);
      monday.setDate(date.getDate() + diff);
      return monday;
    }

    function generateWeeks(count = 10) {
      const datalist = document.getElementById('week-options');
      const input = document.getElementById('week-select');
      const currentMonday = getCurrentMonday(new Date());

      for (let i = -count; i <= count; i++) {
        const monday = new Date(currentMonday);
        monday.setDate(monday.getDate() + i * 7);

        const friday = new Date(monday);
        friday.setDate(friday.getDate() + 4);

        const label = `${formatDate(monday)}-${formatDate(friday)}.${friday.getFullYear()}`;
        const option = document.createElement('option');
        option.value = label;
        datalist.appendChild(option);

        if (i === 0) {
          input.value = label;
        }
      }
    }

    function toggleMode() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      document.getElementById('label-input').style.display = mode === 'label' ? 'block' : 'none';
      document.getElementById('dates-input').style.display = mode === 'dates' ? 'flex' : 'none';
    }

    function validateForm() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      if (mode === 'dates') {
        const start = document.querySelector('[name="start_date"]').value;
        const end = document.querySelector('[name="end_date"]').value;
        if (!start || !end) {
          alert('Пожалуйста, выберите начальную и конечную дату.');
          return false;
        }
      } else {
        const label = document.getElementById('week-select').value.trim();
        if (!label) {
          alert('Пожалуйста, выберите или введите метку.');
          return false;
        }
      }
      return true;
    }

    function showProgress() {
      document.getElementById('progress-section').style.display = 'block';
    }

    function setProgressBar(current, total) {
      const bar = document.getElementById('progress-bar');
      if (total <= 0) {
        bar.classList.add('indeterminate');
        bar.style.width = '';
      } else {
        bar.classList.remove('indeterminate');
        bar.style.width = Math.round(current / total * 100) + '%';
      }
    }

    function setProgressStatus(message, isError = false) {
      const el = document.getElementById('progress-status');
      el.textContent = message;
      el.style.color = isError ? '#842029' : '#084298';
    }

    function appendLog(lines) {
      const log = document.getElementById('progress-log');
      log.textContent = lines.join('\n');
      log.scrollTop = log.scrollHeight;
    }

    function showError(message) {
      setProgressStatus(message, true);
      setProgressBar(0, 0);
    }

    async function pollStatus(jobId) {
      try {
        const response = await fetch(`/fetch-status/${jobId}`);
        const data = await response.json();

        if (!data.ok) {
          clearInterval(statusPollInterval);
          showError(data.error || 'Не удалось получить статус загрузки');
          document.getElementById('submit-btn').disabled = false;
          return;
        }

        setProgressStatus(data.message || 'Идёт загрузка…');
        setProgressBar(data.progress_current || 0, data.progress_total || 0);
        appendLog(data.logs || []);

        if (data.status === 'done') {
          clearInterval(statusPollInterval);
          setProgressBar(1, 1);
          setProgressStatus('Готово! Переход на канбан…');
          window.location.href = '/kanban';
        }

        if (data.status === 'error') {
          clearInterval(statusPollInterval);
          showError(data.error || 'Ошибка загрузки задач');
          document.getElementById('submit-btn').disabled = false;
        }
      } catch (error) {
        clearInterval(statusPollInterval);
        showError(`Ошибка при проверке статуса: ${error}`);
        document.getElementById('submit-btn').disabled = false;
      }
    }

    async function startFetch(event) {
      event.preventDefault();

      if (!validateForm()) {
        return false;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      showProgress();
      setProgressStatus('Запускаем загрузку задач…');

      const form = document.getElementById('fetch-form');
      const formData = new FormData(form);

      try {
        const response = await fetch('/start-fetch', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (!response.ok || !data.ok) {
          submitBtn.disabled = false;
          showError(data.error || 'Не удалось запустить загрузку');
          return false;
        }

        if (statusPollInterval) {
          clearInterval(statusPollInterval);
        }
        await pollStatus(data.job_id);
        statusPollInterval = setInterval(() => pollStatus(data.job_id), 1200);
      } catch (error) {
        submitBtn.disabled = false;
        showError(`Ошибка запуска загрузки: ${error}`);
      }

      return false;
    }

    generateWeeks();
  </script>
</body>
</html>
